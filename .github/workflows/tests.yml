name: tests

# Everything here is free: no model calls, no API keys, standard library only. The measurement
# harnesses under measure/ are deliberately NOT run — they spend real tokens, so they stay a thing a
# contributor runs deliberately and reports in the pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No system word list is installed, and that is the point: the dictionary ships with the
      # plugin, so a verdict does not depend on which list a machine happens to have. Ubuntu's
      # `wamerican` and macOS's `web2` disagree about api, amd, aws, ids and ads, and this job used to
      # install one so the tests could exercise "the path a developer machine takes". There is one path
      # now. See plugins/prose-guard/data/english-words.README.
      - name: no system dictionary is used
        run: |
          python3 - <<'CHECK'
          import sys
          sys.path.insert(0, "plugins/prose-guard/lib")
          import jargon
          assert len(jargon.ENGLISH_WORDS) > 200000, "the shipped dictionary did not load"
          assert jargon.is_acronym("AWS"), "AWS should be an acronym on every machine"
          assert not jargon.is_acronym("THE"), "THE is an English word on every machine"
          print(f"{len(jargon.ENGLISH_WORDS):,} words, shipped")
          CHECK

      - run: python3 tests/test_prose_guard.py
      - run: python3 tests/test_docs_match_code.py

      # And prove the suites need no model: a missing `claude` binary must not change the result.
      - name: no model calls
        run: |
          mkdir -p "$RUNNER_TEMP/nobin"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin" python3 tests/test_prose_guard.py

  version:
    # Nobody's installed copy moves unless the version does: `claude plugin install` is a no-op when
    # the plugin is already present at any version, and `plugin update` only moves on a version
    # change. Eight commits shipped under 0.1.0 once, and the people who had installed it kept a
    # skill with a flag that did not exist.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the version must move when the plugin does
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- plugins/; then
            echo "no change under plugins/, so no version bump needed"
            exit 0
          fi
          before=$(git show "$base":plugins/prose-guard/.claude-plugin/plugin.json \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          after=$(python3 -c 'import json; print(json.load(open("plugins/prose-guard/.claude-plugin/plugin.json"))["version"])')
          echo "plugin.json: $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "::error::plugins/ changed but the version is still $after. Nobody's installed copy"
            echo "::error::will update: plugin install is a no-op at any version, and plugin update"
            echo "::error::only moves on a version change. Bump it in BOTH plugin.json and"
            echo "::error::.claude-plugin/marketplace.json."
            exit 1
          fi
          # Different is not the same as newer, and only checking difference let a branch take the
          # version BACKWARDS while this passed. That is the same failure the check exists to prevent,
          # in the form it could not see: somebody already on the higher version is offered a lower one
          # and never moves, and nothing anywhere says so.
          python3 - "$before" "$after" <<'SEMVER'
          import sys
          def parts(v):
              return tuple(int(x) for x in v.split("."))
          before, after = sys.argv[1], sys.argv[2]
          if parts(after) < parts(before):
              print(f"::error::the version went backwards, {before} -> {after}. Anybody already on "
                    f"{before} is offered {after} and will never move to it, because an update only "
                    f"goes forwards. If the lower number is deliberate, say so in the pull request and "
                    f"expect every existing install to need removing and adding again.")
              sys.exit(1)
          SEMVER
          market=$(python3 -c 'import json; d=json.load(open(".claude-plugin/marketplace.json")); print([p["version"] for p in d["plugins"] if p["name"]=="prose-guard"][0])')
          if [ "$market" != "$after" ]; then
            echo "::error::plugin.json says $after and marketplace.json says $market. They must match"
            echo "::error::or the catalogue offers a version the plugin does not claim."
            exit 1
          fi
